const T=[['home','Principal','home'],['shorts','Shorts','shorts'],['feed','Notificaciones','bell'],['me','Tú','user']];
function hd(mode){const h=mode=='home';document.body.style.setProperty('--ht',h?'104px':'56px');
 $('#hd').innerHTML=`<div class="lg">${I('subs')}Premium</div><button onclick="sbar(1)">${I('search')}</button>`;
 $('#ch').style.display=h?'flex':'none';
 if(h)$('#ch').innerHTML=`<button class="cp mn" onclick="dr(1)" aria-label="Menú">${I('menu')}</button>`+[['Todos',''],['Videojuegos',20],['Música',10],['Noticias',25],['Deportes',17]].map(x=>`<button class="cp ${x[1]==cat?'on':''}" onclick="cat='${x[1]}';go('home')">${x[0]}</button>`).join('')}
function go(t){tab=t;if(t!='cfg')last=t;document.body.classList.toggle('fs',t=='shorts');window.scrollTo(0,0);
 $('#nv').innerHTML=T.map(x=>`<button style="color:${x[0]==t?'#fff':'#ddd'}" onclick="go('${x[0]}')">${I(x[2])}${x[1]}</button>`).join('');
 hd(t=='home'?'home':'');
 if(t=='home')show(async()=>list(await av((await yt('videos',{part:'snippet,statistics,contentDetails',chart:'mostPopular',regionCode:reg(),maxResults:24,...(cat?{videoCategoryId:cat}:{})})).items)));
 else if(t=='shorts')show(async()=>{const j=await yt('search',{part:'snippet',q:'#shorts',type:'video',videoDuration:'short',maxResults:15,regionCode:reg()});
  return`<div class="sf one">${j.items.map(v=>`<section data-id="${vid(v)}"><img src="${thumb(v.snippet)}"><button class="mt" onclick="mute()" aria-label="Sonido"></button><div class="ov"><b>@${E(v.snippet.channelTitle)}</b><p style="color:#fff;font-size:14px">${E(v.snippet.title)}</p></div></section>`).join('')}</div>`},obs);
 else if(t=='feed')show(async()=>{if(!tok)return need();const v=await feed(),n=seen;S('seen',seen=Date.now());
  return'<div class="sec one">Hoy</div>'+v.map(x=>{const s=x.snippet;return`<div class="nt one ${new Date(s.publishedAt)>n?'u':''}" onclick="play('${x.id}')"><img class="av" style="width:48px;height:48px" src="${x.av||''}"><div class="tx"><b style="font-weight:500">${E(s.channelTitle)}</b><div>Se subió: ${E(s.title)}</div><small>${ago(s.publishedAt)}</small></div><div class="th"><img src="${thumb(s)}"></div></div>`}).join('')});
 else if(t=='me')show(me);else if(t=='cfg')cfg()}
async function feed(){const s=await yt('subscriptions',{part:'snippet',mine:true,maxResults:15});
 const r=await Promise.all(s.items.map(x=>yt('playlistItems',{part:'snippet',playlistId:'UU'+x.snippet.resourceId.channelId.slice(2),maxResults:3}).then(j=>j.items).catch(()=>[])));
 return full(r.flat().sort((a,b)=>new Date(b.snippet.publishedAt)-new Date(a.snippet.publishedAt)).slice(0,24))}
let io;
function obs(){io=new IntersectionObserver(es=>es.forEach(e=>{const s=e.target;
 if(e.isIntersecting&&!$('#w.on')){if(!s.querySelector('iframe'))s.insertAdjacentHTML('afterbegin',`<iframe src="https://www.youtube.com/embed/${s.dataset.id}?autoplay=1&mute=${snd?0:1}&loop=1&playlist=${s.dataset.id}&controls=0&playsinline=1&enablejsapi=1&origin=${location.origin}" allow="autoplay;fullscreen" referrerpolicy="strict-origin-when-cross-origin"></iframe>`);s.querySelector('.mt').innerHTML=I(snd?'vol':'mute')}
 else s.querySelector('iframe')?.remove()}),{threshold:.7});
 document.querySelectorAll('.sf section').forEach(s=>io.observe(s))}
function mute(){snd=!snd;document.querySelectorAll('.sf iframe').forEach(f=>f.contentWindow.postMessage(JSON.stringify({event:'command',func:snd?'unMute':'mute',args:[]}),'*'));document.querySelectorAll('.mt').forEach(x=>x.innerHTML=I(snd?'vol':'mute'))}
async function me(){if(!tok)return need()+`<div class="pad one"><button class="pill" onclick="go('cfg')">${I('cog')}Ajustes</button></div>`;
 const c=(await yt('channels',{part:'snippet',mine:true})).items[0].snippet;
 let pl=[],lk=[];try{pl=(await yt('playlists',{part:'snippet,contentDetails',mine:true,maxResults:10})).items}catch(e){}
 try{lk=await av((await yt('videos',{part:'snippet,statistics,contentDetails',myRating:'like',maxResults:10})).items)}catch(e){}
 return`<div class="row one" style="gap:16px;padding:16px"><img class="av" style="width:72px;height:72px" src="${c.thumbnails.default.url}"><div><div style="font-size:24px;font-weight:700">${E(c.title)}</div><small>${E(c.customUrl||'')}</small></div></div>
 <div class="sec one" onclick="hist()" style="cursor:pointer">Historial ›</div><div class="hs one">${H.slice(0,8).map(h=>`<div class="rc" onclick="play('${h.id}')"><div class="th"><img src="${h.th}"></div><h3>${E(h.t)}</h3><p class="m">${E(h.c)}</p></div>`).join('')||'<small>Aún no hay videos.</small>'}</div>
 <div class="sec one">Playlists</div><div class="hs one">${pl.map(p=>`<div class="rc" onclick="plist('${p.id}','${E(p.snippet.title)}')"><div class="th"><img src="${thumb(p.snippet)}"><b class="du">${p.contentDetails.itemCount}</b></div><h3>${E(p.snippet.title)}</h3></div>`).join('')}</div>
 <div class="sec one">Videos que me gustan</div><div class="hs one">${lk.map(v=>`<div class="rc" onclick="play('${v.id}')"><div class="th"><img src="${thumb(v.snippet)}"></div><h3>${E(v.snippet.title)}</h3></div>`).join('')}</div>`}
function hist(){hd('');$('#ch').style.display='none';show(async()=>bar('Historial')+`<div class="one" style="padding:0 12px 8px"><input class="t" placeholder="Buscar en el historial" oninput="document.querySelectorAll('.hi').forEach(e=>e.style.display=e.textContent.toLowerCase().includes(this.value.toLowerCase())?'':'none')"></div><div class="sec one">Hoy</div>`+H.map(h=>`<div class="rc hi one" onclick="play('${h.id}')"><div class="th"><img src="${h.th}"></div><div class="tx"><h3>${E(h.t)}</h3><p>${E(h.c)}</p></div></div>`).join(''))}
function plist(id,t){show(async()=>bar(t)+(await full((await yt('playlistItems',{part:'snippet',playlistId:id,maxResults:50})).items)).map(rc).map(x=>x.replace('class="rc"','class="rc one"')).join(''))}
function subs(){hd('');show(async()=>{if(!tok)return need();const s=(await yt('subscriptions',{part:'snippet',mine:true,maxResults:50,order:'relevance'})).items;
 const v=await feed();return`<div class="hs one" style="padding:12px 16px">${s.map(x=>`<div onclick="chan('${x.snippet.resourceId.channelId}')" style="text-align:center;width:72px;flex:none;cursor:pointer"><img class="av" style="width:56px;height:56px" src="${x.snippet.thumbnails.default.url}"><small style="display:block;overflow:hidden;white-space:nowrap;text-overflow:ellipsis">${E(x.snippet.title)}</small></div>`).join('')}</div>`+list(v)})}
function chan(id){hd('');show(async()=>{const c=(await yt('channels',{part:'snippet,statistics',id})).items[0];
 return`<div class="row one"><img class="av" style="width:72px;height:72px" src="${c.snippet.thumbnails.default.url}"><div><div style="font-size:22px;font-weight:700">${E(c.snippet.title)}</div><small>${fmt(c.statistics.subscriberCount)} suscriptores · ${c.statistics.videoCount} videos</small></div></div>`+list(await full((await yt('playlistItems',{part:'snippet',playlistId:'UU'+id.slice(2),maxResults:24})).items))})}
function cfg(){hd('');$('#v').innerHTML=bar('Ajustes')+`<div class="pad one" style="max-width:560px"><label>YouTube Data API key</label><input class="t" id="k" value="${E(C.key)}" placeholder="AIza...">
<label>Google OAuth Client ID</label><input class="t" id="ci" value="${E(C.cid)}" placeholder="xxxx.apps.googleusercontent.com">
<label>API key de Anthropic (resumen, preguntas y traducción)</label><input class="t" id="ak" type="password" value="${E(C.ak)}" placeholder="sk-ant-...">
<label>Modelo de Claude</label><input class="t" id="md" value="${E(C.model||'claude-sonnet-5-5')}">
<label>Modelo para traducir comentarios (más barato y rápido)</label><input class="t" id="mt" value="${E(C.mtr||'claude-haiku-5-5')}"><label>URL del backend (opcional, recomendado)</label><input class="t" id="be" value="${E(C.be)}" placeholder="https://tu-worker.workers.dev"><label>Región (ej. AR, MX, ES)</label><input class="t" id="rg" value="${E(C.reg||'')}" maxlength="2">
<label style="display:flex;gap:8px;align-items:center;color:#fff"><input type="checkbox" id="au" ${C.auto===false?'':'checked'}> Traducir comentarios al español automáticamente</label><br>
<button class="pill w" style="display:inline-flex" onclick="save()">Guardar</button> <button class="pill" style="display:inline-flex" onclick="login()">Iniciar sesión con Google</button><p id="ok" class="m" style="margin-top:12px"></p></div>`}
function save(){C={key:$('#k').value.trim(),cid:$('#ci').value.trim(),ak:$('#ak').value.trim(),model:$('#md').value.trim(),mtr:$('#mt').value.trim(),be:$('#be').value.trim(),reg:$('#rg').value.trim().toUpperCase(),auto:$('#au').checked};S('cfg',C);$('#ok').textContent='Guardado ✓'}
const gsi=()=>new Promise((ok,no)=>{if(window.google?.accounts)return ok();const e=document.createElement('script');e.src='https://accounts.google.com/gsi/client';e.onload=ok;e.onerror=()=>no(Error('No se pudo cargar Google Sign-In'));document.head.append(e)});
async function auth(prompt='select_account'){if(!C.cid){go('cfg');throw Error('Falta el Client ID')}await gsi();
 return new Promise((ok,no)=>google.accounts.oauth2.initTokenClient({client_id:C.cid,scope:'https://www.googleapis.com/auth/youtube.force-ssl',prompt,callback:r=>r.access_token?(tok=sessionStorage.tok=r.access_token,ok()):no(Error(r.error||'No se pudo iniciar sesión'))}).requestAccessToken())}
function login(){auth().then(()=>go(tab)).catch(e=>alert(e.message))}
async function claude(sys,msgs,max,model){const be=C.be&&C.be.replace(/\/$/,'');if(!be&&!C.ak)throw Error('Falta la API key de Anthropic (o la URL del backend) en Ajustes.');
 const r=await fetch(be?be+'/ai':'https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json',...(be?{}:{'x-api-key':C.ak,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'})},body:JSON.stringify({model:model||C.model||'claude-sonnet-5-5',max_tokens:max,system:sys,messages:msgs})});
 const j=await r.json().catch(()=>({error:{message:'Respuesta inválida ('+r.status+')'}}));if(j.error)throw Error(j.error.message);return j.content.map(b=>b.text||'').join('')}
const SYS='Eres el asistente de un reproductor de video. Responde siempre en español y de forma breve. No tienes la transcripción: solo título, descripción y comentarios. Si algo no se puede saber con eso, dilo.';
const ctx=()=>`Título: ${cur.title}\nCanal: ${cur.ch}\nDescripción: ${cur.desc.slice(0,3000)}\nComentarios:\n`+cur.cm.slice(0,25).map(c=>'- '+c.t.slice(0,300)).join('\n');
function sheet(t,h,foot=''){if(!$('#sh'))history.pushState({s:1},'');$('#sh')?.remove();$('#w').insertAdjacentHTML('beforeend',`<div class="sh" id="sh"><div class="shh">${t}<button class="bk" onclick="history.back()">${I('x')}</button></div><div class="shb" id="sb2">${h}</div>${foot}</div>`)}
function aiSheet(){sheet('Haz una pregunta sobre este video',['Resume el video','Recomienda contenido relacionado','¿De qué trata?','¿Cuáles son los puntos clave?'].map(q=>`<button class="ai" onclick="ask(this.textContent)">${q}</button>`).join('')+'<div id="chat"></div><small>La IA puede cometer errores, así que verifica las respuestas.</small>',`<form class="cb" onsubmit="event.preventDefault();ask(this.q.value);this.q.value=''"><input name="q" placeholder="Haz una pregunta…"><button class="pill w">${I('share')}</button></form>`)}
async function ask(q){if(!q)return;if(!$('#chat'))aiSheet();const p=$('#chat');cur.h=cur.h||[];
 cur.h.push({role:'user',content:(cur.h.length?'':ctx()+'\n\nPregunta: ')+q});
 p.insertAdjacentHTML('beforeend',`<div class="u">${E(q)}</div><div class="a" id="pe">…</div>`);const e=$('#pe');
 try{const t=await claude(SYS,cur.h,1200);cur.h.push({role:'assistant',content:t});e.textContent=t}catch(x){cur.h.pop();e.textContent=x.message}e.removeAttribute('id');$('#sb2').scrollTop=1e9}
const TC=L('tc',{});
async function tr(){cur.cm.forEach(c=>{if(c.tt==null&&TC[c.t])c.tt=TC[c.t]});const p=cur.cm.filter(c=>c.tt==null);if(!p.length)return;
 const o=await claude('Traduce al español natural cada comentario del array JSON. Si ya está en español, déjalo igual. Responde SOLO con un array JSON de strings, mismo orden y longitud.',[{role:'user',content:JSON.stringify(p.map(c=>c.t.slice(0,600)))}],4000,C.mtr||'claude-haiku-5-5');
 const m=o.match(/\[[\s\S]*\]/);if(!m)throw Error('La traducción devolvió un formato inválido');const a=JSON.parse(m[0]);
 p.forEach((c,i)=>{c.tt=a[i]||c.t;TC[c.t]=c.tt});const k=Object.keys(TC);if(k.length>400)k.slice(0,150).forEach(x=>delete TC[x]);S('tc',TC)}
const ctext=c=>cur.es&&c.tt!=null?c.tt:c.t;
function paint(){const l=$('#cl');if(l)l.innerHTML=cur.cm.map(c=>`<div class="cm"><img class="av" src="${c.p}"><div><small>@${E(c.a)} · ${ago(c.d)}</small><p>${E(ctext(c))}</p><small>${I('like')} ${fmt(c.l)}${c.r?' · '+c.r+' respuestas ›':''}</small></div></div>`).join('')||'<small>Sin comentarios.</small>';
 const t=$('#tg');if(t)t.textContent=cur.es?'Traducido ✓ · ver original':'Traducir al español';const pv=$('#pv');if(pv&&cur.cm[0])pv.textContent=ctext(cur.cm[0])}
async function load(order){cur.order=order;try{const j=await yt('commentThreads',{part:'snippet',videoId:cur.id,order,maxResults:30,textFormat:'plainText'});
 cur.cm=j.items.map(i=>{const s=i.snippet.topLevelComment.snippet;return{a:s.authorDisplayName,p:s.authorProfileImageUrl,t:s.textDisplay,l:s.likeCount,d:s.publishedAt,r:i.snippet.totalReplyCount}})}catch(e){cur.cm=[];cur.err=e.message}
 paint();if(cur.es&&cur.cm.length)twrap()}
async function twrap(){const t=$('#tg');if(t)t.textContent='Traduciendo…';try{await tr()}catch(e){cur.es=false;cur.err=e.message}paint()}
const toggle=async()=>{cur.es=!cur.es;paint();if(cur.es)twrap()};
function comments(){sheet(`Comentarios <small style="margin-left:6px">${fmt(cur.cc)}</small>`,`<div style="display:flex;gap:8px;margin-bottom:8px"><button class="cp ${cur.order=='relevance'?'on':''}" onclick="load('relevance');comments()">Principales</button><button class="cp ${cur.order=='time'?'on':''}" onclick="load('time');comments()">Más recientes</button><button class="cp" id="tg" onclick="toggle()"></button></div>${cur.err?`<p class="err">${E(cur.err)}</p>`:''}<div id="cl"></div>`);paint()}
function desc(){sheet('Descripción',`<h3 style="font-size:18px">${E(cur.title)}</h3><div class="tl"><div><b>${fmt(cur.lk)}</b>Me gusta</div><div><b>${fmt(cur.vw)}</b>Vistas</div><div><b>${new Date(cur.pub).toLocaleDateString('es',{day:'numeric',month:'short'})}</b>${new Date(cur.pub).getFullYear()}</div></div><div class="dt">${E(cur.desc)}</div><br><button class="pill" onclick="ask('Resume el video')">${I('spark')}Resume el video</button>`)}
async function rate(r){if(!tok)return login();const n=cur.rt==r?'none':r;try{await yt('videos/rate',{id:cur.id,rating:n},'POST');cur.rt=n;$('#lk').style.color=n=='like'?'#3ea6ff':'';$('#dk').style.color=n=='dislike'?'#3ea6ff':''}catch(e){alert(e.message)}}
async function sub(){if(!tok)return login();try{if(cur.sid){await yt('subscriptions',{id:cur.sid},'DELETE');cur.sid=''}else cur.sid=(await yt('subscriptions',{part:'snippet'},'POST',{snippet:{resourceId:{kind:'youtube#channel',channelId:cur.cid}}})).id;$('#sb3').textContent=cur.sid?'Suscrito':'Suscribirse'}catch(e){alert(e.message)}}
function share(){const u='https://youtu.be/'+cur.id;navigator.share?navigator.share({url:u,title:cur.title}):navigator.clipboard.writeText(u)}
function closeW(pop){if(!pop&&history.state){history.go(history.state.s?-2:-1);return}$('#w').classList.remove('on');$('#w').innerHTML='';document.body.style.overflow='';reobs()}
const reobs=()=>io&&document.querySelectorAll('.sf section').forEach(x=>{io.unobserve(x);io.observe(x)});
addEventListener('popstate',()=>{const t=history.state;if(!t?.s)$('#sh')?.remove();if(!t?.w&&!t?.s&&$('#w.on'))closeW(1)});
document.addEventListener('visibilitychange',()=>{if(document.hidden)document.querySelectorAll('.sf iframe').forEach(f=>f.remove());else reobs()});
async function play(id){const w=$('#w');document.querySelectorAll('.sf iframe').forEach(f=>f.remove());if(w.classList.contains('on'))history.replaceState({w:1},'');else history.pushState({w:1},'');w.classList.add('on');document.body.style.overflow='hidden';w.scrollTop=0;
 w.innerHTML=`<div class="pl"><iframe src="https://www.youtube.com/embed/${id}?autoplay=1&playsinline=1&rel=0&enablejsapi=1" allow="autoplay;fullscreen;picture-in-picture" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe><button class="bk" onclick="closeW()">${I('down')}</button></div><div class="wi" id="wb"><div class="sk"></div></div>`;
 w.style.overflowY='auto';
 try{const v=(await yt('videos',{part:'snippet,statistics',id})).items[0],s=v.snippet;
  cur={id,title:s.title,ch:s.channelTitle,cid:s.channelId,desc:s.description,cm:[],es:C.auto!==false,h:null,order:'relevance',cc:v.statistics.commentCount||0,lk:v.statistics.likeCount||0,vw:v.statistics.viewCount||0,pub:s.publishedAt};
  H=[{id,t:s.title,c:s.channelTitle,th:thumb(s),d:Date.now()},...H.filter(x=>x.id!=id)].slice(0,100);S('hist',H);
  $('#wb').innerHTML=`<div class="bd"><h1 onclick="desc()">${E(s.title)}</h1><div class="m" onclick="desc()" style="padding-top:4px">${fmt(cur.vw)} vistas · ${ago(s.publishedAt)} <b style="color:#fff">…más</b></div></div>
<div class="chrow"><img class="av" id="cav"><div class="tx"><div>${E(s.channelTitle)}</div><small id="csb"></small></div><button class="pill w" id="sb3" onclick="sub()">Suscribirse</button></div>
<div class="act"><div class="pill"><span id="lk" onclick="rate('like')" style="display:flex;gap:6px">${I('like')}${fmt(cur.lk)}</span><span style="opacity:.3">|</span><span id="dk" onclick="rate('dislike')">${I('like','dis')}</span></div><button class="pill" onclick="share()">${I('share')}Compartir</button><button class="pill" onclick="aiSheet()">${I('spark')}Preguntar</button></div>
<div class="cmc" onclick="comments()"><b>Comentarios</b> <small>${fmt(cur.cc)}</small><p id="pv" style="margin-top:6px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis"></p></div><div id="rel" style="margin-top:12px"></div>`;
  load('relevance');
  yt('channels',{part:'snippet,statistics',id:s.channelId}).then(j=>{const c=j.items[0];$('#cav').src=c.snippet.thumbnails.default.url;$('#csb').textContent=fmt(c.statistics.subscriberCount)+' suscriptores'}).catch(()=>{});
  if(tok)yt('subscriptions',{part:'id',mine:true,forChannelId:s.channelId}).then(j=>{if(j.items[0]){cur.sid=j.items[0].id;$('#sb3').textContent='Suscrito'}}).catch(()=>{});
  yt('videos',{part:'snippet,statistics,contentDetails',chart:'mostPopular',regionCode:reg(),videoCategoryId:s.categoryId,maxResults:15}).then(async j=>$('#rel').innerHTML=j.items.filter(x=>x.id!=id).map(rc).join('')).catch(()=>{})
 }catch(e){$('#wb').innerHTML='<p class="pad err">'+E(e.message)+'</p>'}}
let ly=0;addEventListener('scroll',()=>{const y=scrollY;$('#top').classList.toggle('h',y>ly&&y>80);ly=y},{passive:true});
const h0=location.hash.slice(1);go(['shorts','feed','me'].includes(h0)?h0:'home');if(!C.key&&!C.be)go('cfg');
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))addEventListener('load',()=>navigator.serviceWorker.register('sw.js'));
</script></body></html>
